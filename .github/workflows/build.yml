name: Build

# Nada se compila solo. Se compila cuando tú lo indicas:
#  - a mano: Actions → Build → Run workflow,
#  - o subiendo un tag v* (además publica el APK en una Release).
# Los pushes y los pull requests NO lanzan nada.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  native-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas del motor nativo (C++ en el host)
        run: |
          cmake -S app/src/main/cpp/tests -B build-tests -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests -j
          mkdir -p test-out && ./build-tests/foton_tests test-out
      - uses: actions/upload-artifact@v4
        with:
          name: imagenes-de-prueba
          path: test-out/*.ppm

  apk:
    runs-on: ubuntu-latest
    needs: native-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas Kotlin (JVM)
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Compilar APK
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: c-camera-apk
          path: app/build/outputs/apk/release/*.apk
      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/release/*.apk

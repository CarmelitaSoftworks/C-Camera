# Compilación de C Camera en GitLab CI.
#
# Nada se compila solo. Se compila cuando tú lo indicas:
#  - a mano: Build → Pipelines → "Run pipeline" (elige la rama y pulsa Run pipeline),
#  - desde la API de GitLab (POST /projects/:id/pipeline),
#  - o creando un tag v* (Code → Tags → New tag, p. ej. v0.2.0).
# Un push normal a cualquier rama no lanza nada.
#
# El APK queda en Build → Artifacts (o en el job "apk" → Browse / Download).

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_PIPELINE_SOURCE == "api"
    - if: $CI_COMMIT_TAG =~ /^v/

stages:
  - pruebas
  - apk

pruebas-nativas:
  stage: pruebas
  image: gcc:14
  script:
    - apt-get update -qq && apt-get install -y -qq cmake > /dev/null
    - cmake -S app/src/main/cpp/tests -B build-tests -DCMAKE_BUILD_TYPE=Release
    - cmake --build build-tests -j
    - mkdir -p test-out && ./build-tests/foton_tests test-out
  artifacts:
    name: imagenes-de-prueba
    paths:
      - test-out/
    expire_in: 7 days

apk:
  stage: apk
  image: eclipse-temurin:17-jdk
  needs: [pruebas-nativas]
  variables:
    ANDROID_HOME: $CI_PROJECT_DIR/.android-sdk
    GRADLE_USER_HOME: $CI_PROJECT_DIR/.gradle-home
    GRADLE_OPTS: -Dorg.gradle.daemon=false
  cache:
    key: android-sdk-35-gradle
    paths:
      - .android-sdk/
      - .gradle-home/caches/
      - .gradle-home/wrapper/
  before_script:
    - apt-get update -qq && apt-get install -y -qq unzip curl > /dev/null
    - |
      if [ ! -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
        mkdir -p "$ANDROID_HOME/cmdline-tools"
        curl -sSL -o /tmp/cmdline.zip https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip
        unzip -q /tmp/cmdline.zip -d /tmp/cmdline
        mv /tmp/cmdline/cmdline-tools "$ANDROID_HOME/cmdline-tools/latest"
      fi
    - yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
    - '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" > /dev/null'
    - echo "sdk.dir=$ANDROID_HOME" > local.properties
    - chmod +x gradlew
  script:
    - ./gradlew testDebugUnitTest
    - ./gradlew assembleRelease
  artifacts:
    name: c-camera-apk
    paths:
      - app/build/outputs/apk/release/*.apk
    reports:
      junit: app/build/test-results/testDebugUnitTest/*.xml
    expire_in: 30 days
